name: mau
on:
  workflow_dispatch:
    inputs:
      nguon: { description: JSON array nguồn, required: false, default: "" }
concurrency: { group: cao, cancel-in-progress: false }
jobs:
  mau:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python mau.py
        env: { NGUON_JSON: "${{ secrets.NGUON_JSON }}", NGUON_TAY: "${{ inputs.nguon }}" }
      - uses: actions/upload-artifact@v4
        with: { name: mau-html, path: mau/, retention-days: 1 }
