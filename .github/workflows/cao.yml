# Worker cào FB "public" — bản chép của `worker/cao.py` trong repo selenova.
#
# Repo public = phút Actions MIỄN PHÍ → gánh phần lớn page và cả bậc Playwright
# (cao.py tự cài Chromium khi httpx bị đá login). Mỗi run một IP Azure mới.
#
# NHỊP KHÔNG Ở ĐÂY. Không có `schedule:` — n8n (wf "FB cào 00 Nhịp") bấm
# workflow_dispatch mỗi 15' và truyền danh sách nguồn qua input `nguon`
# (đọc từ crawl_sources.cao_o='public'). Repo này KHÔNG giữ danh sách nguồn —
# repo public thì secret cũng chỉ là chỗ giấu tạm, không giữ thì không lộ.
#
# Repo này KHÔNG giữ khoá Supabase/Telegram nào. Chỉ N8N_URL + N8N_TOKEN.
name: cao

on:
  workflow_dispatch:
    inputs:
      nguon:
        description: JSON array nguồn [{id, slug, name, kind, can_pw}] — n8n truyền vào
        required: true

concurrency:
  group: cao
  cancel-in-progress: false

jobs:
  cao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python cao.py
        env:
          CAO_WORKER: public
          NGUON_JSON: ${{ inputs.nguon }}
          N8N_URL: ${{ secrets.N8N_URL }}
          N8N_TOKEN: ${{ secrets.N8N_TOKEN }}
